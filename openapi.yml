openapi: "3.1.0"
info:
  title: Clawkson API
  description: API for the Clawkson AI assistant platform
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:47821
    description: Local development server

paths:
  # ── Auth ────────────────────────────────────────────────────

  /api/auth/register:
    post:
      summary: Register a new user. The very first user automatically receives the admin role.
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created and session cookie set
          headers:
            Set-Cookie:
              description: HttpOnly session cookie (clawkson_session)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid email or password too short
        "409":
          description: Email already registered

  /api/auth/login:
    post:
      summary: Log in and receive a session cookie
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Log out and clear the session cookie
      operationId: logout
      tags: [Auth]
      responses:
        "204":
          description: Logged out

  /api/auth/me:
    get:
      summary: Get the currently authenticated user
      operationId: me
      tags: [Auth]
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated

  /api/auth/profile:
    patch:
      summary: Update the current user's profile (display name, bio, avatar)
      operationId: patchProfile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
        "401":
          description: Not authenticated

  # ── Admin ────────────────────────────────────────────────────

  /api/admin/users:
    get:
      summary: List all users (admin only)
      operationId: adminListUsers
      tags: [Admin]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Forbidden

  /api/admin/users/{id}/role:
    patch:
      summary: Update a user's role (admin only; cannot demote yourself)
      operationId: adminUpdateUserRole
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Cannot demote yourself
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/admin/users/{id}:
    delete:
      summary: Delete a user (admin only; cannot delete yourself)
      operationId: adminDeleteUser
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete yourself
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ── Agents ──────────────────────────────────────────────────

  /api/agents:
    get:
      summary: List all agents
      operationId: listAgents
      tags: [Agents]
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      summary: Create a new agent
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "200":
          description: The created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /api/agents/{id}:
    get:
      summary: Get an agent by ID
      operationId: getAgent
      tags: [Agents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      summary: Update an agent
      operationId: patchAgent
      tags: [Agents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAgentRequest"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    delete:
      summary: Delete an agent
      operationId: deleteAgent
      tags: [Agents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Conversations ───────────────────────────────────────────

  /api/conversations:
    get:
      summary: List all conversations
      operationId: listConversations
      tags: [Conversations]
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      summary: Create a new conversation
      operationId: createConversation
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "200":
          description: The created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      summary: Delete all conversations owned by the authenticated user
      operationId: deleteAllConversations
      tags: [Conversations]
      responses:
        "204":
          description: All conversations deleted

  /api/conversations/{id}:
    get:
      summary: Get a conversation by ID
      operationId: getConversation
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      summary: Delete a conversation and all its messages
      operationId: deleteConversation
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Conversation deleted
        "403":
          description: Forbidden (not owner or admin)
        "404":
          description: Not found

  /api/conversations/{id}/messages:
    get:
      summary: List messages in a conversation
      operationId: listMessages
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      summary: Send a message in a conversation
      operationId: sendMessage
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: The sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      summary: Clear all messages from a conversation without deleting the conversation
      operationId: clearMessages
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Messages cleared
        "403":
          description: Forbidden (no write access)
        "404":
          description: Conversation not found

  /api/conversations/{id}/chat:
    post:
      summary: Send a message and get an AI response (blocking)
      operationId: chat
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: User message and assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Conversation not found

  /api/conversations/{id}/chat/stream:
    post:
      summary: Send a message and stream the AI response as SSE
      operationId: chatStream
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: >
            SSE stream – each event is JSON with `delta` (message text),
            `reasoning_delta` (thinking trace), `done`, or `error`
          content:
            text/event-stream:
              schema:
                type: string

  # ── Conversation Shares ─────────────────────────────────────

  /api/conversations/{id}/shares:
    get:
      summary: List users a conversation is shared with (owner or admin only)
      operationId: listConversationShares
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationShareResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      summary: Share a conversation with another user by email
      operationId: createConversationShare
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "200":
          description: The created share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationShareResponse"
        "400":
          description: Cannot share with yourself
        "403":
          description: Forbidden
        "404":
          description: Target user not found

  /api/conversations/{conversation_id}/shares/{user_id}:
    delete:
      summary: Remove a conversation share
      operationId: removeConversationShare
      tags: [Conversations]
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Share not found

  # ── Containers ──────────────────────────────────────────────

  /api/agents/{id}/container:
    get:
      summary: Get container status for an agent
      operationId: getContainerStatus
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Container status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStatus"
        "404":
          description: No container for this agent
    delete:
      summary: Remove container and workspace
      operationId: removeContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "503":
          description: Docker not available

  /api/agents/{id}/container/start:
    post:
      summary: Create and start a container for an agent
      operationId: startContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Container started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStatus"
        "400":
          description: Container not enabled for agent

  /api/agents/{id}/container/stop:
    post:
      summary: Stop a running container
      operationId: stopContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Stopped

  /api/agents/{id}/container/logs:
    get:
      summary: Get container logs
      operationId: getContainerLogs
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tail, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Container logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: string

  /api/agents/{id}/container/exec:
    post:
      summary: Execute a command in the container
      operationId: execInContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"

  /api/agents/{id}/container/workspace:
    get:
      summary: List workspace directory contents
      operationId: listWorkspace
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Sub-path within the workspace to list (default is workspace root)
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListing"
        "400":
          description: Path escapes workspace
        "503":
          description: Docker not available
    delete:
      summary: Delete a file or directory from the workspace
      operationId: deleteWorkspaceEntry
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeleteRequest"
      responses:
        "204":
          description: Deleted
        "400":
          description: Path escapes workspace or is a directory without recursive=true
        "403":
          description: Admin only
        "404":
          description: Path not found

  /api/agents/{id}/container/workspace/upload:
    post:
      summary: Upload files into a workspace directory
      operationId: uploadToWorkspace
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Target sub-directory within the workspace (default is workspace root)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more files to upload
      responses:
        "200":
          description: Upload result with per-file status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUploadResponse"
        "403":
          description: Admin only
        "503":
          description: Docker not available

  /api/agents/{id}/container/workspace/download:
    get:
      summary: Download a file from the workspace
      operationId: downloadFromWorkspace
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Path of the file to download, relative to the workspace root
      responses:
        "200":
          description: File content with appropriate Content-Type and Content-Disposition headers
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Path escapes workspace or path is a directory
        "404":
          description: File not found
        "503":
          description: Docker not available

  /api/agents/{id}/container/workspace/watch:
    get:
      summary: Stream workspace filesystem change events as SSE
      operationId: watchWorkspace
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: >
            SSE stream – each event is a JSON object with `type`
            ("created", "modified", or "deleted") and `path` (relative to workspace root).
          content:
            text/event-stream:
              schema:
                type: string
        "503":
          description: Docker not available

  # ── Skills ────────────────────────────────────────────────

  /api/skills:
    get:
      summary: List all skills
      operationId: listSkills
      tags: [Skills]
      responses:
        "200":
          description: Array of skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      summary: Create a new skill (admin only)
      operationId: createSkill
      tags: [Skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillRequest"
      responses:
        "200":
          description: Skill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /api/skills/{id}:
    get:
      summary: Get a skill by ID
      operationId: getSkill
      tags: [Skills]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Skill details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
    patch:
      summary: Update a skill (admin only)
      operationId: patchSkill
      tags: [Skills]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSkillRequest"
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
    delete:
      summary: Delete a skill (admin only)
      operationId: deleteSkill
      tags: [Skills]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /api/agents/{id}/skills:
    get:
      summary: List skill IDs linked to an agent
      operationId: listAgentSkills
      tags: [Skills]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Array of skill UUIDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
    post:
      summary: Link a skill to an agent (admin only)
      operationId: linkAgentSkill
      tags: [Skills]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id]
              properties:
                skill_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Linked

  /api/agents/{id}/skills/{skill_id}:
    delete:
      summary: Unlink a skill from an agent (admin only)
      operationId: unlinkAgentSkill
      tags: [Skills]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: skill_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked

  # ── Connectors ──────────────────────────────────────────────

  /api/connectors:
    get:
      summary: List all connectors
      operationId: listConnectors
      tags: [Connectors]
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      summary: Create a connector
      operationId: createConnector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorRequest"
      responses:
        "200":
          description: The created connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /api/connectors/{id}:
    get:
      summary: Get a connector by ID
      operationId: getConnector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          description: Not found
    patch:
      summary: Update a connector (e.g. toggle enabled)
      operationId: patchConnector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConnectorRequest"
      responses:
        "200":
          description: The updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          description: Not found
    delete:
      summary: Delete a connector
      operationId: deleteConnector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Knowledge Base ──────────────────────────────────────────

  /api/knowledge:
    get:
      summary: List all knowledge bases visible to the authenticated user
      operationId: listKnowledgeBases
      tags: [Knowledge Base]
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      summary: Create a knowledge base
      operationId: createKnowledgeBase
      tags: [Knowledge Base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKbRequest"
      responses:
        "200":
          description: The created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"

  /api/knowledge/{id}:
    get:
      summary: Get a knowledge base by ID
      operationId: getKnowledgeBase
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "403":
          description: No access
        "404":
          description: Not found
    patch:
      summary: Update a knowledge base (owner or admin only)
      operationId: patchKnowledgeBase
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchKbRequest"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      summary: Delete a knowledge base and all its entries (owner or admin only)
      operationId: deleteKnowledgeBase
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/entries:
    get:
      summary: List all entries in a knowledge base
      operationId: listKnowledgeEntries
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeEntry"
        "403":
          description: No access
    post:
      summary: Manually create a knowledge entry
      operationId: createKnowledgeEntry
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "200":
          description: The created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Title or content is empty
        "403":
          description: Forbidden

  /api/knowledge/{kb_id}/entries/{entry_id}:
    patch:
      summary: Update a knowledge entry
      operationId: patchKnowledgeEntry
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEntryRequest"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      summary: Delete a knowledge entry
      operationId: deleteKnowledgeEntry
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/upload:
    post:
      summary: >
        Upload one or more files; text is extracted, chunked, and embedded automatically.
        Supported: .pdf, .txt, .md, .csv, .json (max 16 MB per request).
      operationId: uploadKnowledgeFiles
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Upload summary with per-file results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "403":
          description: Forbidden

  /api/knowledge/{id}/embed:
    post:
      summary: Generate embeddings for all entries that do not yet have one
      operationId: embedKnowledgeEntries
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Embedding result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResult"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/search:
    post:
      summary: Semantic search over a knowledge base using vector similarity
      operationId: searchKnowledge
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSearchResult"
        "403":
          description: No access

  /api/knowledge/{id}/documents:
    get:
      summary: List original source documents uploaded to this knowledge base
      operationId: listKnowledgeDocuments
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
        "403":
          description: No access

  /api/knowledge/{kb_id}/documents/{doc_id}/download:
    get:
      summary: Download the original source document
      operationId: downloadKnowledgeDocument
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: doc_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File content with appropriate Content-Type header
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: No access
        "404":
          description: Not found
        "503":
          description: S3 storage unavailable

  /api/knowledge/{kb_id}/documents/{doc_id}:
    delete:
      summary: Delete a source document (S3 object + DB record)
      operationId: deleteKnowledgeDocument
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: doc_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/shares:
    get:
      summary: List users a knowledge base is shared with (owner or admin only)
      operationId: listKbShares
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbShareInfo"
        "403":
          description: Forbidden
    post:
      summary: Share a knowledge base with another user (owner or admin only)
      operationId: createKbShare
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbShareRequest"
      responses:
        "200":
          description: The created share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KbShareInfo"
        "400":
          description: Cannot share with yourself
        "403":
          description: Forbidden
        "404":
          description: Target user not found

  /api/knowledge/{kb_id}/shares/{user_id}:
    delete:
      summary: Remove a share from a knowledge base
      operationId: removeKbShare
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Share not found

  /api/knowledge/{id}/agents:
    get:
      summary: List agent IDs that have access to this knowledge base
      operationId: listKbAgents
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Array of agent UUIDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "403":
          description: No access
    post:
      summary: Link an agent to a knowledge base (owner or admin only)
      operationId: linkKbAgent
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAgentRequest"
      responses:
        "201":
          description: Linked
        "403":
          description: Forbidden

  /api/knowledge/{kb_id}/agents/{agent_id}:
    delete:
      summary: Unlink an agent from a knowledge base
      operationId: unlinkKbAgent
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: agent_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Unlinked
        "403":
          description: Forbidden
        "404":
          description: Link not found

  # ── Tools ───────────────────────────────────────────────────
  # Tools are not stored in the database. The endpoint derives them
  # at request time from two sources:
  #   1. Built-in tools: always available (code_execution, workspace_*, knowledge_*).
  #   2. Connector tools: one authenticated_http entry per enabled connector owned by the caller.

  /api/tools:
    get:
      summary: List available tools
      operationId: listTools
      tags: [Tools]
      description: >
        Returns all tools available to the calling user. Built-in tools
        (code execution, workspace I/O, knowledge search) are always included.
        One `authenticated_http` tool entry is synthesised for each enabled
        platform connector owned by the caller.
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"

  # ── LLM Connectors ──────────────────────────────────────────────

  /api/llm-connectors:
    get:
      summary: List all LLM connectors (API keys masked)
      operationId: listLlmConnectors
      tags: [LLM Connectors]
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmConnector"
    post:
      summary: Create an LLM connector
      operationId: createLlmConnector
      tags: [LLM Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmConnectorRequest"
      responses:
        "200":
          description: Created connector (API key masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnector"

  /api/llm-connectors/test:
    post:
      summary: Test an LLM connector configuration without saving it
      operationId: testLlmConnector
      tags: [LLM Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmConnectorRequest"
      responses:
        "200":
          description: Test result with latency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /api/llm-connectors/{id}:
    get:
      summary: Get an LLM connector
      operationId: getLlmConnector
      tags: [LLM Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnector"
        "404":
          description: Not found
    patch:
      summary: Update an LLM connector
      operationId: patchLlmConnector
      tags: [LLM Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLlmConnectorRequest"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnector"
        "404":
          description: Not found
    delete:
      summary: Delete an LLM connector
      operationId: deleteLlmConnector
      tags: [LLM Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Uploads (File Attachments) ────────────────────────────────────

  /api/uploads:
    post:
      summary: Upload files for chat attachments
      operationId: uploadFiles
      tags: [Uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more files to upload
                conversation_id:
                  type: string
                  format: uuid
                  description: Optional conversation to associate uploads with
      responses:
        "200":
          description: Uploaded file metadata with IDs for use in ChatRequest.attachment_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: No files provided
        "503":
          description: File storage not configured

  /api/uploads/{id}:
    get:
      summary: Download an uploaded file
      operationId: getUpload
      tags: [Uploads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File content with appropriate Content-Type header
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not authorized to access this file
        "404":
          description: File not found
    delete:
      summary: Delete an uploaded file
      operationId: deleteUpload
      tags: [Uploads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not authorized
        "404":
          description: Not found

  # ── Settings ────────────────────────────────────────────────────

  /api/settings:
    get:
      summary: Get application settings
      operationId: getSettings
      tags: [Settings]
      responses:
        "200":
