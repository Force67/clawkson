openapi: "3.1.0"
info:
  title: Clawkson API
  description: API for the Clawkson AI assistant platform
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:47821
    description: Local development server

paths:
  # ── Auth ────────────────────────────────────────────────────

  /api/auth/register:
    post:
      summary: Register a new user. The very first user automatically receives the admin role.
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created and session cookie set
          headers:
            Set-Cookie:
              description: HttpOnly session cookie (clawkson_session)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid email or password too short
        "409":
          description: Email already registered

  /api/auth/login:
    post:
      summary: Log in and receive a session cookie
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Log out and clear the session cookie
      operationId: logout
      tags: [Auth]
      responses:
        "204":
          description: Logged out

  /api/auth/me:
    get:
      summary: Get the currently authenticated user
      operationId: me
      tags: [Auth]
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated

  # ── Admin ────────────────────────────────────────────────────

  /api/admin/users:
    get:
      summary: List all users (admin only)
      operationId: adminListUsers
      tags: [Admin]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Forbidden

  /api/admin/users/{id}/role:
    patch:
      summary: Update a user's role (admin only; cannot demote yourself)
      operationId: adminUpdateUserRole
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Cannot demote yourself
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/admin/users/{id}:
    delete:
      summary: Delete a user (admin only; cannot delete yourself)
      operationId: adminDeleteUser
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete yourself
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ── Agents ──────────────────────────────────────────────────

  /api/agents:
    get:
      summary: List all agents
      operationId: listAgents
      tags: [Agents]
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      summary: Create a new agent
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "200":
          description: The created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /api/agents/{id}:
    get:
      summary: Get an agent by ID
      operationId: getAgent
      tags: [Agents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      summary: Update an agent
      operationId: patchAgent
      tags: [Agents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAgentRequest"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    delete:
      summary: Delete an agent
      operationId: deleteAgent
      tags: [Agents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Conversations ───────────────────────────────────────────

  /api/conversations:
    get:
      summary: List all conversations
      operationId: listConversations
      tags: [Conversations]
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      summary: Create a new conversation
      operationId: createConversation
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "200":
          description: The created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      summary: Delete all conversations owned by the authenticated user
      operationId: deleteAllConversations
      tags: [Conversations]
      responses:
        "204":
          description: All conversations deleted

  /api/conversations/{id}:
    get:
      summary: Get a conversation by ID
      operationId: getConversation
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      summary: Delete a conversation and all its messages
      operationId: deleteConversation
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Conversation deleted
        "403":
          description: Forbidden (not owner or admin)
        "404":
          description: Not found

  /api/conversations/{id}/messages:
    get:
      summary: List messages in a conversation
      operationId: listMessages
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      summary: Send a message in a conversation
      operationId: sendMessage
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: The sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      summary: Clear all messages from a conversation without deleting the conversation
      operationId: clearMessages
      tags: [Conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Messages cleared
        "403":
          description: Forbidden (no write access)
        "404":
          description: Conversation not found

  /api/conversations/{id}/chat:
    post:
      summary: Send a message and get an AI response (blocking)
      operationId: chat
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: User message and assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Conversation not found

  /api/conversations/{id}/chat/stream:
    post:
      summary: Send a message and stream the AI response as SSE
      operationId: chatStream
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: >
            SSE stream – each event is JSON with `delta` (message text),
            `reasoning_delta` (thinking trace), `done`, or `error`
          content:
            text/event-stream:
              schema:
                type: string

  # ── Conversation Shares ─────────────────────────────────────

  /api/conversations/{id}/shares:
    get:
      summary: List users a conversation is shared with (owner or admin only)
      operationId: listConversationShares
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationShareResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      summary: Share a conversation with another user by email
      operationId: createConversationShare
      tags: [Conversations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "200":
          description: The created share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationShareResponse"
        "400":
          description: Cannot share with yourself
        "403":
          description: Forbidden
        "404":
          description: Target user not found

  /api/conversations/{conversation_id}/shares/{user_id}:
    delete:
      summary: Remove a conversation share
      operationId: removeConversationShare
      tags: [Conversations]
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Share not found

  # ── Containers ──────────────────────────────────────────────

  /api/agents/{id}/container:
    get:
      summary: Get container status for an agent
      operationId: getContainerStatus
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Container status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStatus"
        "404":
          description: No container for this agent
    delete:
      summary: Remove container and workspace
      operationId: removeContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "503":
          description: Docker not available

  /api/agents/{id}/container/start:
    post:
      summary: Create and start a container for an agent
      operationId: startContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Container started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStatus"
        "400":
          description: Container not enabled for agent

  /api/agents/{id}/container/stop:
    post:
      summary: Stop a running container
      operationId: stopContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Stopped

  /api/agents/{id}/container/logs:
    get:
      summary: Get container logs
      operationId: getContainerLogs
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tail, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Container logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: string

  /api/agents/{id}/container/exec:
    post:
      summary: Execute a command in the container
      operationId: execInContainer
      tags: [Containers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"

  # ── Connectors ──────────────────────────────────────────────

  /api/connectors:
    get:
      summary: List all connectors
      operationId: listConnectors
      tags: [Connectors]
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      summary: Create a connector
      operationId: createConnector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorRequest"
      responses:
        "200":
          description: The created connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"

  /api/connectors/{id}:
    get:
      summary: Get a connector by ID
      operationId: getConnector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          description: Not found
    patch:
      summary: Update a connector (e.g. toggle enabled)
      operationId: patchConnector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConnectorRequest"
      responses:
        "200":
          description: The updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "404":
          description: Not found
    delete:
      summary: Delete a connector
      operationId: deleteConnector
      tags: [Connectors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Knowledge Base ──────────────────────────────────────────

  /api/knowledge:
    get:
      summary: List all knowledge bases visible to the authenticated user
      operationId: listKnowledgeBases
      tags: [Knowledge Base]
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      summary: Create a knowledge base
      operationId: createKnowledgeBase
      tags: [Knowledge Base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKbRequest"
      responses:
        "200":
          description: The created knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"

  /api/knowledge/{id}:
    get:
      summary: Get a knowledge base by ID
      operationId: getKnowledgeBase
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "403":
          description: No access
        "404":
          description: Not found
    patch:
      summary: Update a knowledge base (owner or admin only)
      operationId: patchKnowledgeBase
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchKbRequest"
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      summary: Delete a knowledge base and all its entries (owner or admin only)
      operationId: deleteKnowledgeBase
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/entries:
    get:
      summary: List all entries in a knowledge base
      operationId: listKnowledgeEntries
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeEntry"
        "403":
          description: No access
    post:
      summary: Manually create a knowledge entry
      operationId: createKnowledgeEntry
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "200":
          description: The created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Title or content is empty
        "403":
          description: Forbidden

  /api/knowledge/{kb_id}/entries/{entry_id}:
    patch:
      summary: Update a knowledge entry
      operationId: patchKnowledgeEntry
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEntryRequest"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      summary: Delete a knowledge entry
      operationId: deleteKnowledgeEntry
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/upload:
    post:
      summary: >
        Upload one or more files; text is extracted, chunked, and embedded automatically.
        Supported: .pdf, .txt, .md, .csv, .json (max 16 MB per request).
      operationId: uploadKnowledgeFiles
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Upload summary with per-file results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "403":
          description: Forbidden

  /api/knowledge/{id}/embed:
    post:
      summary: Generate embeddings for all entries that do not yet have one
      operationId: embedKnowledgeEntries
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Embedding result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResult"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/search:
    post:
      summary: Semantic search over a knowledge base using vector similarity
      operationId: searchKnowledge
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSearchResult"
        "403":
          description: No access

  /api/knowledge/{id}/documents:
    get:
      summary: List original source documents uploaded to this knowledge base
      operationId: listKnowledgeDocuments
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
        "403":
          description: No access

  /api/knowledge/{kb_id}/documents/{doc_id}/download:
    get:
      summary: Download the original source document
      operationId: downloadKnowledgeDocument
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: doc_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File content with appropriate Content-Type header
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: No access
        "404":
          description: Not found
        "503":
          description: S3 storage unavailable

  /api/knowledge/{kb_id}/documents/{doc_id}:
    delete:
      summary: Delete a source document (S3 object + DB record)
      operationId: deleteKnowledgeDocument
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: doc_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/knowledge/{id}/shares:
    get:
      summary: List users a knowledge base is shared with (owner or admin only)
      operationId: listKbShares
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: List of shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KbShareInfo"
        "403":
          description: Forbidden
    post:
      summary: Share a knowledge base with another user (owner or admin only)
      operationId: createKbShare
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KbShareRequest"
      responses:
        "200":
          description: The created share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KbShareInfo"
        "400":
          description: Cannot share with yourself
        "403":
          description: Forbidden
        "404":
          description: Target user not found

  /api/knowledge/{kb_id}/shares/{user_id}:
    delete:
      summary: Remove a share from a knowledge base
      operationId: removeKbShare
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Share not found

  /api/knowledge/{id}/agents:
    get:
      summary: List agent IDs that have access to this knowledge base
      operationId: listKbAgents
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Array of agent UUIDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "403":
          description: No access
    post:
      summary: Link an agent to a knowledge base (owner or admin only)
      operationId: linkKbAgent
      tags: [Knowledge Base]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAgentRequest"
      responses:
        "201":
          description: Linked
        "403":
          description: Forbidden

  /api/knowledge/{kb_id}/agents/{agent_id}:
    delete:
      summary: Unlink an agent from a knowledge base
      operationId: unlinkKbAgent
      tags: [Knowledge Base]
      parameters:
        - { name: kb_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: agent_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Unlinked
        "403":
          description: Forbidden
        "404":
          description: Link not found

  # ── Tools ───────────────────────────────────────────────────

  /api/tools:
    get:
      summary: List all tools
      operationId: listTools
      tags: [Tools]
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
    post:
      summary: Create a tool
      operationId: createTool
      tags: [Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToolRequest"
      responses:
        "200":
          description: The created tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  /api/tools/{id}:
    get:
      summary: Get a tool by ID
      operationId: getTool
      tags: [Tools]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  # ── LLM Connectors ──────────────────────────────────────────────

  /api/llm-connectors:
    get:
      summary: List all LLM connectors (API keys masked)
      operationId: listLlmConnectors
      tags: [LLM Connectors]
      responses:
        "200":
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmConnector"
    post:
      summary: Create an LLM connector
      operationId: createLlmConnector
      tags: [LLM Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmConnectorRequest"
      responses:
        "200":
          description: Created connector (API key masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnector"

  /api/llm-connectors/test:
    post:
      summary: Test an LLM connector configuration without saving it
      operationId: testLlmConnector
      tags: [LLM Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLlmConnectorRequest"
      responses:
        "200":
          description: Test result with latency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /api/llm-connectors/{id}:
    get:
      summary: Get an LLM connector
      operationId: getLlmConnector
      tags: [LLM Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnector"
        "404":
          description: Not found
    patch:
      summary: Update an LLM connector
      operationId: patchLlmConnector
      tags: [LLM Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLlmConnectorRequest"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConnector"
        "404":
          description: Not found
    delete:
      summary: Delete an LLM connector
      operationId: deleteLlmConnector
      tags: [LLM Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Uploads (File Attachments) ────────────────────────────────────

  /api/uploads:
    post:
      summary: Upload files for chat attachments
      operationId: uploadFiles
      tags: [Uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more files to upload
                conversation_id:
                  type: string
                  format: uuid
                  description: Optional conversation to associate uploads with
      responses:
        "200":
          description: Uploaded file metadata with IDs for use in ChatRequest.attachment_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: No files provided
        "503":
          description: File storage not configured

  /api/uploads/{id}:
    get:
      summary: Download an uploaded file
      operationId: getUpload
      tags: [Uploads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: File content with appropriate Content-Type header
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not authorized to access this file
        "404":
          description: File not found
    delete:
      summary: Delete an uploaded file
      operationId: deleteUpload
      tags: [Uploads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not authorized
        "404":
          description: Not found

  # ── Settings ────────────────────────────────────────────────────

  /api/settings:
    get:
      summary: Get application settings
      operationId: getSettings
      tags: [Settings]
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      summary: Update application settings (admin only)
      operationId: patchSettings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    # ── Agent ──────────────────────────────────────────────────

    Agent:
      type: object
      required: [id, name, description, status, container_enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          nullable: true
        container_enabled:
          type: boolean
          default: false
        container_config:
          $ref: "#/components/schemas/AgentContainerConfig"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentStatus:
      type: string
      enum: [online, offline, busy, error]

    AgentContainerConfig:
      type: object
      properties:
        cpu_limit:
          type: number
          format: double
          nullable: true
          description: CPU limit in cores (e.g. 1.0)
        memory_limit_mb:
          type: integer
          nullable: true
          description: Memory limit in megabytes
        network_enabled:
          type: boolean
          default: false
          description: Whether network access is enabled

    ContainerStatus:
      type: object
      required: [agent_id, state, image, workspace_path]
      properties:
        agent_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [creating, running, stopped, removing]
        image:
          type: string
        workspace_path:
          type: string

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: Shell command to execute
        timeout:
          type: integer
          description: Timeout in seconds (default 30, max 300)
          nullable: true

    ExecResult:
      type: object
      required: [stdout, stderr, exit_code, timed_out]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        timed_out:
          type: boolean

    CreateAgentRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        container_enabled:
          type: boolean
          nullable: true
        container_config:
          $ref: "#/components/schemas/AgentContainerConfig"
          nullable: true

    PatchAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/AgentStatus"
        container_enabled:
          type: boolean
          nullable: true
        container_config:
          $ref: "#/components/schemas/AgentContainerConfig"
          nullable: true

    # ── Conversation ───────────────────────────────────────────

    Conversation:
      type: object
      required: [id, title, agent_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        agent_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      required: [title, agent_id]
      properties:
        title:
          type: string
        agent_id:
          type: string
          format: uuid

    Message:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        created_at:
          type: string
          format: date-time

    MessageRole:
      type: string
      enum: [user, assistant, system, tool]

    SendMessageRequest:
      type: object
      required: [content, role]
      properties:
        content:
          type: string
        role:
          $ref: "#/components/schemas/MessageRole"

    # ── Connector ──────────────────────────────────────────────

    Connector:
      type: object
      required: [id, name, connector_type, enabled, config, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        connector_type:
          $ref: "#/components/schemas/ConnectorType"
        enabled:
          type: boolean
        config:
          type: object
        created_at:
          type: string
          format: date-time

    ConnectorType:
      type: string
      enum: [telegram, gmail, slack, custom]

    CreateConnectorRequest:
      type: object
      required: [name, connector_type, config]
      properties:
        name:
          type: string
        connector_type:
          $ref: "#/components/schemas/ConnectorType"
        config:
          type: object

    PatchConnectorRequest:
      type: object
      properties:
        enabled:
          type: boolean

    TelegramConnectorConfig:
      type: object
      required: [bot_token]
      description: Configuration fields for a Telegram connector
      properties:
        bot_token:
          type: string
          description: Telegram Bot API token (from @BotFather)

    # ── Knowledge Base ────────────────────────────────────────

    KnowledgeBase:
      type: object
      required: [id, owner_id, name, description, embedding_model, entry_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        embedding_model:
          type: string
          description: Ollama model used to embed entries (e.g. qwen3-embedding:8b)
        entry_count:
          type: integer
          format: int64
          description: Number of knowledge entries in this base
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateKbRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        embedding_model:
          type: string
          nullable: true
          description: Override the default embedding model (qwen3-embedding:8b)

    PatchKbRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    KnowledgeEntry:
      type: object
      required: [id, knowledge_base_id, title, content, has_embedding, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        token_count:
          type: integer
          nullable: true
        has_embedding:
          type: boolean
          description: Whether a vector embedding has been generated for this entry
        source_document_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the KnowledgeDocument this entry was chunked from (if any)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEntryRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string

    PatchEntryRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string

    KnowledgeDocument:
      type: object
      required: [id, knowledge_base_id, filename, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    KnowledgeSearchResult:
      type: object
      required: [entry, score]
      properties:
        entry:
          $ref: "#/components/schemas/KnowledgeEntry"
        score:
          type: number
          format: double
          description: Cosine similarity score (0–1, higher is more relevant)
        document_url:
          type: string
          nullable: true
          description: Download URL for the source document (if the entry was chunked from a file)

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          type: integer
          nullable: true
          description: Max results to return (default 5, max 20)

    KbShareRequest:
      type: object
      required: [email, permission]
      properties:
        email:
          type: string
          description: Email of the user to share with
        permission:
          $ref: "#/components/schemas/SharePermission"

    KbShareInfo:
      type: object
      required: [id, user_id, email, display_name, permission]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        permission:
          $ref: "#/components/schemas/SharePermission"

    EmbedResult:
      type: object
      required: [embedded, failed]
      properties:
        embedded:
          type: integer
        failed:
          type: integer

    UploadResult:
      type: object
      required: [files_processed, entries_created, embedded, embed_failed, errors]
      properties:
        files_processed:
          type: integer
        entries_created:
          type: integer
        embedded:
          type: integer
        embed_failed:
          type: integer
        errors:
          type: array
          items:
            type: string

    LinkAgentRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          format: uuid

    # ── Tool ───────────────────────────────────────────────────

    Tool:
      type: object
      required: [id, name, description, connector_id, schema, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        connector_id:
          type: string
          format: uuid
        schema:
          type: object
        enabled:
          type: boolean

    CreateToolRequest:
      type: object
      required: [name, description, connector_id, schema]
      properties:
        name:
          type: string
        description:
          type: string
        connector_id:
          type: string
          format: uuid
        schema:
          type: object

    # ── LLM Connector ──────────────────────────────────────────

    LlmProviderType:
      type: string
      enum: [azure, open_router, open_ai, custom]
      description: The LLM provider backend type

    LlmConnector:
      type: object
      required: [id, name, provider_type, model, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          $ref: "#/components/schemas/LlmProviderType"
        model:
          type: string
        api_base_url:
          type: string
          nullable: true
          description: Required for custom provider; optional for others
        azure_deployment:
          type: string
          nullable: true
          description: Azure OpenAI deployment name
        azure_api_version:
          type: string
          nullable: true
          description: Azure OpenAI API version (e.g. 2024-02-01)
        api_key_masked:
          type: string
          nullable: true
          description: Masked API key (e.g. sk-or-••••1234); never the real key
        created_at:
          type: string
          format: date-time

    CreateLlmConnectorRequest:
      type: object
      required: [name, provider_type, model, api_key]
      properties:
        name:
          type: string
        provider_type:
          $ref: "#/components/schemas/LlmProviderType"
        model:
          type: string
        api_key:
          type: string
          description: Plain-text API key (stored encrypted in the database; masked on all responses)
        api_base_url:
          type: string
          nullable: true
        azure_deployment:
          type: string
          nullable: true
        azure_api_version:
          type: string
          nullable: true

    PatchLlmConnectorRequest:
      type: object
      properties:
        name:
          type: string
        provider_type:
          $ref: "#/components/schemas/LlmProviderType"
        model:
          type: string
        api_key:
          type: string
          nullable: true
        api_base_url:
          type: string
          nullable: true
        azure_deployment:
          type: string
          nullable: true
        azure_api_version:
          type: string
          nullable: true

    ChatRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: The user message content
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          nullable: true
          description: >
            When set, enables extended thinking / chain-of-thought at the
            specified effort level. Omit or null to disable reasoning.
        search_enabled:
          type: boolean
          default: true
          description: >
            When false, knowledge-base search tools are excluded even if the
            agent has linked KBs.
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: >
            IDs of previously-uploaded attachments (from POST /api/uploads) to
            associate with this message.

    ChatResponse:
      type: object
      required: [user_message, assistant_message]
      properties:
        user_message:
          $ref: "#/components/schemas/Message"
        assistant_message:
          $ref: "#/components/schemas/Message"

    # ── Auth ──────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        display_name:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, display_name, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserRole:
      type: string
      enum: [admin, user]

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    SharePermission:
      type: string
      enum: [read, write]

    CreateShareRequest:
      type: object
      required: [email, permission]
      properties:
        email:
          type: string
          format: email
          description: Email of the user to share with
        permission:
          $ref: "#/components/schemas/SharePermission"

    ConversationShareResponse:
      type: object
      required: [share, shared_with_user]
      properties:
        share:
          $ref: "#/components/schemas/ConversationShare"
        shared_with_user:
          $ref: "#/components/schemas/ShareUserInfo"

    ConversationShare:
      type: object
      required: [id, conversation_id, shared_by, shared_with, permission, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        shared_by:
          type: string
          format: uuid
        shared_with:
          type: string
          format: uuid
        permission:
          $ref: "#/components/schemas/SharePermission"
        created_at:
          type: string
          format: date-time

    ShareUserInfo:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string

    TestConnectionResponse:
      type: object
      required: [ok, latency_ms]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
          nullable: true

    # ── Settings ───────────────────────────────────────────────

    Settings:
      type: object
      properties:
        default_llm_connector_id:
          type: string
          format: uuid
          nullable: true
        etl_llm_connector_id:
          type: string
          format: uuid
          nullable: true
          description: >
            LLM connector used during Knowledge Base ETL for semantic chunking.
            When set, the LLM is called to find optimal sentence boundaries instead of
            the built-in heuristic splitter. Leave null to use heuristic chunking only.
        theme:
          type: string

    PatchSettingsRequest:
      type: object
      properties:
        default_llm_connector_id:
          type: string
          format: uuid
          nullable: true
        etl_llm_connector_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Set the LLM connector used for ETL semantic chunking.
            Pass null to clear (falls back to heuristic chunking).
        theme:
          type: string

    # ── Uploads / Attachments ──────────────────────────────────

    AttachmentInfo:
      type: object
      required: [id, filename, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    UploadResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentInfo"
