          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      summary: Update application settings (admin only)
      operationId: patchSettings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ── Audit Log ──────────────────────────────────────────────────

  /api/audit-log/conversations/{conv_id}:
    get:
      summary: List tool audit entries for a conversation
      operationId: listAuditByConversation
      tags: [AuditLog]
      parameters:
        - name: conv_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolAuditEntry"
        "403":
          description: Forbidden
        "404":
          description: Conversation not found

  /api/audit-log/conversations/{conv_id}/stats:
    get:
      summary: Get allowed/denied counts for a conversation
      operationId: getAuditStats
      tags: [AuditLog]
      parameters:
        - name: conv_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditStats"

  /api/audit-log/agents/{agent_id}:
    get:
      summary: List tool audit entries for an agent
      operationId: listAuditByAgent
      tags: [AuditLog]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolAuditEntry"
        "403":
          description: Forbidden
        "404":
          description: Agent not found

  /api/audit-log/denied:
    get:
      summary: List denied audit entries for the current user
      operationId: listDeniedAudit
      tags: [AuditLog]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Denied audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolAuditEntry"

  # ── Policy Presets ─────────────────────────────────────────────

  /api/policy-presets:
    get:
      summary: List built-in connector policy presets
      operationId: listPolicyPresets
      tags: [PolicyPresets]
      responses:
        "200":
          description: Available policy presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyPreset"

components:
  schemas:
    # ── Skill ──────────────────────────────────────────────────

    Skill:
      type: object
      required: [id, name, description, instructions, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Lowercase, hyphen-separated name used as /skill-name in prompts
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
        instructions:
          type: string
          description: Full instructions loaded when the skill is invoked
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSkillRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
        instructions:
          type: string
          default: ""

    PatchSkillRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
        instructions:
          type: string

    # ── Agent ──────────────────────────────────────────────────

    Agent:
      type: object
      required: [id, name, description, status, container_enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          nullable: true
        container_enabled:
          type: boolean
          default: false
        container_config:
          $ref: "#/components/schemas/AgentContainerConfig"
          nullable: true
        connector_policies:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPolicy"
          default: []
          description: >
            Proxy policies controlling which HTTP requests the agent can
            make through each connector. Deny-first, allow-second, deny-by-default.
        owner_id:
          type: string
          format: uuid
          nullable: true
        shared:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentStatus:
      type: string
      enum: [online, offline, busy, error]

    AgentContainerConfig:
      type: object
      properties:
        image:
          type: string
          nullable: true
          description: >
            Docker image to use for this agent's container.
            Defaults to "clawkson-sandbox:latest" if not set.
          example: clawkson-sandbox:latest
        cpu_limit:
          type: number
          format: double
          nullable: true
          description: CPU limit in cores (e.g. 1.0)
        memory_limit_mb:
          type: integer
          nullable: true
          description: Memory limit in megabytes
        network_enabled:
          type: boolean
          default: false
          description: Whether network access is enabled
        container_mode:
          type: string
          enum: [temporal, persistent]
          default: temporal
          description: Container lifecycle mode
        execution_mode:
          type: string
          enum: [container, host, ssh]
          default: container
          description: >
            Where code execution happens.
            "container" — sandboxed Docker/bwrap (safe, default).
            "host" — directly on the server (dangerous, no isolation).
            "ssh" — on a remote machine via SSH.
        ssh_config:
          $ref: "#/components/schemas/SshConfig"
          nullable: true
          description: SSH connection config (only used when execution_mode is "ssh")

    SshConfig:
      type: object
      required: [host, username]
      properties:
        host:
          type: string
          description: Remote hostname or IP address
        port:
          type: integer
          default: 22
          description: SSH port
        username:
          type: string
          description: SSH username
        key_credential_id:
          type: string
          format: uuid
          nullable: true
          description: ID of a credential containing the SSH private key
        working_directory:
          type: string
          nullable: true
          description: Working directory on the remote machine

    ContainerStatus:
      type: object
      required: [agent_id, state, image, workspace_path]
      properties:
        agent_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [creating, running, stopped, removing]
        image:
          type: string
        workspace_path:
          type: string

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: Shell command to execute
        timeout:
          type: integer
          description: Timeout in seconds (default 30, max 300)
          nullable: true
        output_dir:
          type: string
          nullable: true
          description: >
            Workspace-relative directory to scan for output files after execution
            (default "outputs"). Set to empty string to disable output collection.

    ExecResult:
      type: object
      required: [stdout, stderr, exit_code, timed_out]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        timed_out:
          type: boolean
        output_files:
          type: array
          nullable: true
          description: Files found in the output directory after execution
          items:
            $ref: "#/components/schemas/OutputFile"

    OutputFile:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: Path relative to the workspace root
        size:
          type: integer
          description: File size in bytes

    WorkspaceEntry:
      type: object
      required: [name, path, is_dir, size]
      properties:
        name:
          type: string
          description: Entry name (file or directory name only)
        path:
          type: string
          description: Path relative to the workspace root
        is_dir:
          type: boolean
        size:
          type: integer
          description: File size in bytes (0 for directories)
        modified_at:
          type: string
          format: date-time
          nullable: true

    WorkspaceListing:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
          description: The directory that was listed (relative to workspace root)
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEntry"

    WorkspaceUploadResponse:
      type: object
      required: [uploaded, errors]
      properties:
        uploaded:
          type: array
          items:
            type: string
          description: Relative paths of successfully uploaded files
        errors:
          type: array
          items:
            type: string
          description: Per-file error messages for failed uploads

    WorkspaceDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Path to delete, relative to workspace root
        recursive:
          type: boolean
          default: false
          description: Required when deleting a directory

    CreateAgentRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        container_enabled:
          type: boolean
          nullable: true
        container_config:
          $ref: "#/components/schemas/AgentContainerConfig"
          nullable: true
        connector_policies:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPolicy"
          default: []
        shared:
          type: boolean
          default: false

    PatchAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
        system_prompt:
          type: string
          nullable: true
        temperature:
          type: number
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/AgentStatus"
        container_enabled:
          type: boolean
          nullable: true
        container_config:
          $ref: "#/components/schemas/AgentContainerConfig"
          nullable: true
        connector_policies:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorPolicy"
          description: Replace the agent's connector policies (optional).
        shared:
          type: boolean

    # ── Conversation ───────────────────────────────────────────

    Conversation:
      type: object
      required: [id, title, agent_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        agent_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      required: [title, agent_id]
      properties:
        title:
          type: string
        agent_id:
          type: string
          format: uuid

    Message:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        created_at:
          type: string
          format: date-time

    MessageRole:
      type: string
      enum: [user, assistant, system, tool]

    SendMessageRequest:
      type: object
      required: [content, role]
      properties:
        content:
          type: string
        role:
          $ref: "#/components/schemas/MessageRole"

    # ── Connector ──────────────────────────────────────────────

    Connector:
      type: object
      required: [id, user_id, name, connector_type, enabled, config, context, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: The user who owns this connector
        name:
          type: string
        connector_type:
          $ref: "#/components/schemas/ConnectorType"
        enabled:
          type: boolean
        config:
          type: object
        context:
          type: string
          description: Free-text operational context injected when this connector is invoked (e.g. email address, account info)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConnectorType:
      type: string
      enum: [telegram, gmail, slack, azure_devops, custom]

    CreateConnectorRequest:
      type: object
      required: [name, connector_type, config]
      properties:
        name:
          type: string
        connector_type:
          $ref: "#/components/schemas/ConnectorType"
        config:
          type: object

    PatchConnectorRequest:
      type: object
      properties:
        enabled:
          type: boolean
        context:
          type: string
          description: Free-text operational context for this connector
        name:
          type: string
          description: New display name for the connector
        config:
          type: object
          additionalProperties: true
          description: Replacement config blob (connector-type-specific fields)

    TelegramConnectorConfig:
      type: object
      required: [bot_token]
      description: Configuration fields for a Telegram connector
      properties:
        bot_token:
          type: string
          description: Telegram Bot API token (from @BotFather)

    AzureDevopsConnectorConfig:
      type: object
      required: [organization, pat]
      description: Configuration fields for an Azure DevOps connector
      properties:
        organization:
          type: string
          description: Azure DevOps organization name (e.g. myorg)
        pat:
          type: string
          description: Personal Access Token (PAT) with the required scopes
        project:
          type: string
          description: Default project name or ID (optional — scopes queries to this project)

    # ── Knowledge Base ────────────────────────────────────────

    KnowledgeBase:
      type: object
      required: [id, owner_id, name, description, embedding_model, entry_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        embedding_model:
          type: string
          description: Ollama model used to embed entries (e.g. qwen3-embedding:8b)
        entry_count:
          type: integer
          format: int64
          description: Number of knowledge entries in this base
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateKbRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        embedding_model:
          type: string
          nullable: true
          description: Override the default embedding model (qwen3-embedding:8b)

    PatchKbRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    KnowledgeEntry:
      type: object
      required: [id, knowledge_base_id, title, content, has_embedding, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        token_count:
          type: integer
          nullable: true
        has_embedding:
          type: boolean
          description: Whether a vector embedding has been generated for this entry
        source_document_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the KnowledgeDocument this entry was chunked from (if any)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEntryRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string

    PatchEntryRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string

    KnowledgeDocument:
      type: object
      required: [id, knowledge_base_id, filename, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    KnowledgeSearchResult:
      type: object
      required: [entry, score]
      properties:
        entry:
          $ref: "#/components/schemas/KnowledgeEntry"
        score:
          type: number
          format: double
          description: Cosine similarity score (0–1, higher is more relevant)
        document_url:
          type: string
          nullable: true
          description: Download URL for the source document (if the entry was chunked from a file)

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          type: integer
          nullable: true
          description: Max results to return (default 5, max 20)

    KbShareRequest:
      type: object
      required: [email, permission]
      properties:
        email:
          type: string
          description: Email of the user to share with
        permission:
          $ref: "#/components/schemas/SharePermission"

    KbShareInfo:
      type: object
      required: [id, user_id, email, display_name, permission]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        permission:
          $ref: "#/components/schemas/SharePermission"

    EmbedResult:
      type: object
      required: [embedded, failed]
      properties:
        embedded:
          type: integer
        failed:
          type: integer

    UploadResult:
      type: object
      required: [files_processed, entries_created, embedded, embed_failed, errors]
      properties:
        files_processed:
          type: integer
        entries_created:
          type: integer
        embedded:
          type: integer
        embed_failed:
          type: integer
        errors:
          type: array
          items:
            type: string

    LinkAgentRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          format: uuid

    # ── Tool ───────────────────────────────────────────────────

    Tool:
      type: object
      required: [id, name, description, tool_type, enabled]
      properties:
        id:
          type: string
          description: >
            Stable identifier. Built-in tools use the form "builtin:<name>";
            connector-derived tools use "connector:<uuid>".
        name:
          type: string
        description:
          type: string
        connector_id:
          type: string
          format: uuid
          nullable: true
          description: Present only for connector-derived tools.
        tool_type:
          type: string
          enum: [builtin, connector]
          description: '"builtin" for platform tools; "connector" for authenticated_http entries.'
        enabled:
          type: boolean

    # ── LLM Connector ──────────────────────────────────────────

    LlmProviderType:
      type: string
      enum: [azure, open_router, open_ai, custom]
      description: The LLM provider backend type

    LlmConnector:
      type: object
      required: [id, name, provider_type, model, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          $ref: "#/components/schemas/LlmProviderType"
        model:
          type: string
        api_base_url:
          type: string
          nullable: true
          description: Required for custom provider; optional for others
        azure_deployment:
          type: string
          nullable: true
          description: Azure OpenAI deployment name
        azure_api_version:
          type: string
          nullable: true
          description: Azure OpenAI API version (e.g. 2024-02-01)
        api_key_masked:
          type: string
          nullable: true
          description: Masked API key (e.g. sk-or-••••1234); never the real key
        created_at:
          type: string
          format: date-time

    CreateLlmConnectorRequest:
      type: object
      required: [name, provider_type, model, api_key]
      properties:
        name:
          type: string
        provider_type:
          $ref: "#/components/schemas/LlmProviderType"
        model:
          type: string
        api_key:
          type: string
          description: Plain-text API key (stored encrypted in the database; masked on all responses)
        api_base_url:
          type: string
          nullable: true
        azure_deployment:
          type: string
          nullable: true
        azure_api_version:
          type: string
          nullable: true

    PatchLlmConnectorRequest:
      type: object
      properties:
        name:
          type: string
        provider_type:
          $ref: "#/components/schemas/LlmProviderType"
        model:
          type: string
        api_key:
          type: string
          nullable: true
        api_base_url:
          type: string
          nullable: true
        azure_deployment:
          type: string
          nullable: true
        azure_api_version:
          type: string
          nullable: true

    ChatRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: The user message content
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          nullable: true
          description: >
            When set, enables extended thinking / chain-of-thought at the
            specified effort level. Omit or null to disable reasoning.
        search_enabled:
          type: boolean
          default: true
          description: >
            When false, knowledge-base search tools are excluded even if the
            agent has linked KBs.
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
          description: >
            IDs of previously-uploaded attachments (from POST /api/uploads) to
            associate with this message.
        temperature:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 2
          description: Per-message temperature override. Falls back to agent default.
        max_tokens:
          type: integer
          nullable: true
          description: Per-message max-tokens override. Falls back to agent default.
        llm_connector_id:
          type: string
          format: uuid
          nullable: true
          description: Per-message LLM connector override. Falls back to agent default.
        subtask_llm_connector_id:
          type: string
          format: uuid
          nullable: true
          description: Per-message subtask LLM connector override. Falls back to agent default.

    ChatResponse:
      type: object
      required: [user_message, assistant_message]
      properties:
        user_message:
          $ref: "#/components/schemas/Message"
        assistant_message:
          $ref: "#/components/schemas/Message"

    # ── Auth ──────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        display_name:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, display_name, role, bio, avatar_url, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        bio:
          type: string
          description: Free-text context about the user that agents can read
        avatar_url:
          type: string
          description: URL of the user's avatar image (data URL or remote URL)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserRole:
      type: string
      enum: [admin, user]

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    PatchProfileRequest:
      type: object
      description: All fields are optional; only provided fields are updated.
      properties:
        display_name:
          type: string
          description: New display name (must be non-empty if provided)
        bio:
          type: string
          description: Free-text context about the user for agent consumption
        avatar_url:
          type: string
          description: Base64 data URL or remote URL for the avatar image

    SharePermission:
      type: string
      enum: [read, write]

    CreateShareRequest:
      type: object
      required: [email, permission]
      properties:
        email:
          type: string
          format: email
          description: Email of the user to share with
        permission:
          $ref: "#/components/schemas/SharePermission"

    ConversationShareResponse:
      type: object
      required: [share, shared_with_user]
      properties:
        share:
          $ref: "#/components/schemas/ConversationShare"
        shared_with_user:
          $ref: "#/components/schemas/ShareUserInfo"

    ConversationShare:
      type: object
      required: [id, conversation_id, shared_by, shared_with, permission, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        shared_by:
          type: string
          format: uuid
        shared_with:
          type: string
          format: uuid
        permission:
          $ref: "#/components/schemas/SharePermission"
        created_at:
          type: string
          format: date-time

    ShareUserInfo:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string

    TestConnectionResponse:
      type: object
      required: [ok, latency_ms]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
          nullable: true

    # ── Settings ───────────────────────────────────────────────

    Settings:
      type: object
      properties:
        default_llm_connector_id:
          type: string
          format: uuid
          nullable: true
        etl_llm_connector_id:
          type: string
          format: uuid
          nullable: true
          description: >
            LLM connector used during Knowledge Base ETL for semantic chunking.
            When set, the LLM is called to find optimal sentence boundaries instead of
            the built-in heuristic splitter. Leave null to use heuristic chunking only.
        theme:
          type: string
        agent_base_prompt:
          type: string
          description: >
            Platform-level base system prompt prepended before every agent's own system_prompt.
            Use this to set global guardrails, identity, tool-usage rules, and container
            permissions that apply to all agents. Empty string means no base prompt.
        llm_request_timeout_secs:
          type: integer
          description: >
            Maximum time in seconds to wait for a single LLM response before aborting.
            Clamped to the range 10–600. Default is 120.
          minimum: 10
          maximum: 600
        embedding_api_base_url:
          type: string
          description: >
            OpenAI-compatible base URL for the embedding provider (e.g. Ollama, vLLM, OpenAI).
        embedding_api_key:
          type: string
          description: >
            API key for the embedding provider. Masked on retrieval.
        embedding_model:
          type: string
          description: >
            Default model name for embedding generation. Individual knowledge bases
            can override this with their own model.

    PatchSettingsRequest:
      type: object
      properties:
        default_llm_connector_id:
          type: string
          format: uuid
          nullable: true
        etl_llm_connector_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Set the LLM connector used for ETL semantic chunking.
            Pass null to clear (falls back to heuristic chunking).
        theme:
          type: string
        agent_base_prompt:
          type: string
          description: >
            Platform-level base system prompt prepended before every agent's own system_prompt.
            Set to an empty string to clear it. When non-empty, the final system prompt sent
            to the LLM will be: agent_base_prompt + "\n\n" + agent.system_prompt.
        llm_request_timeout_secs:
          type: integer
          nullable: true
          description: >
            Override the LLM request timeout (seconds). Value is clamped to 10–600.
            Omit to leave unchanged.
        embedding_api_base_url:
          type: string
          description: >
            OpenAI-compatible base URL for the embedding provider.
        embedding_api_key:
          type: string
          description: >
            API key for the embedding provider. Only sent when changing it.
        embedding_model:
          type: string
          description: >
            Default model name for embedding generation.

    # ── Uploads / Attachments ──────────────────────────────────

    AttachmentInfo:
      type: object
      required: [id, filename, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    UploadResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentInfo"

    # ── Permissions & Audit ────────────────────────────────────────

    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
      description: HTTP methods that can be allowed or denied in proxy rules.

    ProxyRule:
      type: object
      required: [methods, path_pattern]
      properties:
        methods:
          type: array
          items:
            $ref: "#/components/schemas/HttpMethod"
          description: HTTP methods this rule applies to. Empty array matches no methods.
        path_pattern:
          type: string
          description: >
            URL path pattern (glob-style). Matched against the path portion of
            the upstream URL. Example: "/gmail/v1/users/me/messages/*"
        description:
          type: string
          default: ""
          description: Human-readable description for display in the UI.

    ConnectorPolicy:
      type: object
      required: [connector_id]
      properties:
        connector_id:
          type: string
          format: uuid
          description: The connector this policy applies to.
        allow:
          type: array
          items:
            $ref: "#/components/schemas/ProxyRule"
          default: []
          description: >
            Allow rules. A request must match at least one to be forwarded.
            Empty array means deny all requests through this connector.
        deny:
          type: array
          items:
            $ref: "#/components/schemas/ProxyRule"
          default: []
          description: >
            Explicit deny rules, checked before allow rules. If a request
            matches any deny rule, it is blocked even if an allow rule would match.
        rate_limit_rpm:
          type: integer
          nullable: true
          description: >
            Maximum requests per minute through this connector. Null means unlimited.

    PolicyPreset:
      type: object
      required: [name, label, connector_type, policy]
      properties:
        name:
          type: string
          description: Machine-readable name, e.g. "gmail_read_only".
        label:
          type: string
          description: Human-readable label, e.g. "Gmail — Read Only".
        connector_type:
          $ref: "#/components/schemas/ConnectorType"
        policy:
          $ref: "#/components/schemas/ConnectorPolicy"

    AuditDecision:
      type: string
      enum: [allowed, denied]
      description: Whether a tool invocation was allowed or denied by the permission guard.

    ToolAuditEntry:
      type: object
      required: [id, conversation_id, agent_id, user_id, tool_name, decision, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tool_name:
          type: string
          description: The tool or proxy endpoint that was invoked.
        http_method:
          type: string
          nullable: true
          description: For proxy requests, the HTTP method used.
        target_path:
          type: string
          nullable: true
          description: >
            For proxy requests, the target URL path (no query string, no credentials).
        connector_id:
          type: string
          format: uuid
          nullable: true
          description: The connector used, if applicable.
        decision:
          $ref: "#/components/schemas/AuditDecision"
        denial_reason:
          type: string
          nullable: true
          description: Human-readable reason when denied.
        duration_ms:
          type: integer
          format: int64
          nullable: true
          description: >
            How long the tool invocation took in milliseconds. Null if denied
            before execution.
        created_at:
          type: string
          format: date-time

    AuditStats:
      type: object
      required: [decision, count]
      properties:
        decision:
          type: string
          description: The audit decision value ("allowed" or "denied").
        count:
          type: integer
          format: int64
          description: Number of entries with this decision.
