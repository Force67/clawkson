services:
  vectorchord:
    image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:${CLAWKSON_VECTORCHORD_PORT:-55435}:5432"
    environment:
      POSTGRES_USER: ${CLAWKSON_DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${CLAWKSON_DB_ADMIN_PASSWORD:-change-me-superuser-password}
      POSTGRES_DB: ${CLAWKSON_DB_ADMIN_DATABASE:-postgres}
    volumes:
      - vectorchord-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${CLAWKSON_S3_PORT:-9100}:9000"
      - "127.0.0.1:${CLAWKSON_S3_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${CLAWKSON_S3_ACCESS_KEY:-clawkson}
      MINIO_ROOT_PASSWORD: ${CLAWKSON_S3_SECRET_KEY:-clawkson-secret-key}
    volumes:
      - minio-data:/data

volumes:
  vectorchord-data:
  minio-data:
